apiVersion: v1
kind: ServiceAccount
metadata:
  name: obs-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- if .Values.migration.roleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.migration.roleArn | quote }}
    {{- end }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: obs-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata: {labels: {app.kubernetes.io/name: obs-console, component: migration}}
    spec:
      restartPolicy: Never
      serviceAccountName: obs-migration
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: {{ include "obs.backendImage" . | quote }}
          args: [python, -m, obs.migrate]
          env:
            - {name: OBS_CONFIG_SECRET_ID, value: {{ .Values.migration.secretId | quote }}}
            {{- range $key, $value := .Values.env }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
