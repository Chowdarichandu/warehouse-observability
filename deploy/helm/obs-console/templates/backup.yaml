{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obs-backup
  {{- with .Values.backup.roleArn }}
  annotations: {eks.amazonaws.com/role-arn: {{ . | quote }}}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: obs-backup}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata: {labels: {app.kubernetes.io/name: obs-console, component: backup}}
        spec:
          serviceAccountName: obs-backup
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: backup
              image: {{ include "obs.backendImage" . | quote }}
              args: [python, -m, obs.backup, create]
              env:
                - {name: OBS_CONFIG_SECRET_ID, value: {{ .Values.backup.secretId | quote }}}
                {{- range $key, $value := .Values.env }}
                - {name: {{ $key }}, value: {{ $value | quote }}}
                {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              volumeMounts: [{name: work, mountPath: /tmp}]
          volumes: [{name: work, emptyDir: {sizeLimit: 10Gi}}]
{{- end }}
