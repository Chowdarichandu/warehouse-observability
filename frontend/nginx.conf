server {
 listen 8080;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
 location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
 location /api/stream {
   proxy_pass http://api:8000;
   proxy_http_version 1.1;
   proxy_set_header Host $http_host;
   proxy_set_header Connection '';
   proxy_buffering off;
   proxy_cache off;
   proxy_read_timeout 1h;
 }
 location /api/ {
   proxy_pass http://api:8000;
   proxy_set_header Host $http_host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_read_timeout 60s;
 }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
 location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
