[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obs-console"
version = "0.1.0"
description = "In-house pipeline observability console, offline demo through M4"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.3", "psycopg[binary]==3.2.9",
  "pydantic-settings==2.9.1", "httpx==0.28.1", "sse-starlette==2.3.5",
  "argon2-cffi==23.1.0", "PyJWT==2.10.1", "APScheduler==3.11.0", "PyYAML==6.0.2",
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[tool.setuptools.packages.find]
include = ["obs*"]

[tool.setuptools.package-data]
"obs.collector" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
