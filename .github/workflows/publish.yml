name: Publish immutable ECR images
on:
  workflow_dispatch:
    inputs:
      region: {description: AWS region, required: true, default: us-east-1}
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: image-publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Require successful verification and safeguards for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repository, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/actions/runs?head_sha={sha}&status=success&per_page=100',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'release-gate'},
          )
          runs = json.load(urllib.request.urlopen(request, timeout=30))['workflow_runs']
          passed = {run['name'] for run in runs if run['event'] == 'push' and run['head_branch'] == 'main' and run['head_sha'] == sha}
          required = {'Verify console', 'Release safeguards'}
          if required - passed:
              raise SystemExit('Wait for successful Verify console and Release safeguards runs for this commit before publishing.')
          PY
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: API image
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/observability-api:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Web image
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/observability-web:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record digests
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          echo "API: $REGISTRY/observability-api@$API_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Web: $REGISTRY/observability-web@$WEB_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Install verified Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3 / Cosign v3.1.4
      - name: Scan the exact published API digest before signing
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ${{ steps.ecr.outputs.registry }}/observability-api@${{ steps.api.outputs.digest }}
          grype-version: v0.121.2
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: published-api-audit.json
      - name: Scan the exact published web digest before signing
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ${{ steps.ecr.outputs.registry }}/observability-web@${{ steps.web.outputs.digest }}
          grype-version: v0.121.2
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: published-web-audit.json
      - name: Sign and verify the exact published digests
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish.yml@refs/heads/main"
          for image in "$REGISTRY/observability-api@$API_DIGEST" "$REGISTRY/observability-web@$WEB_DIGEST"; do
            cosign sign --yes --annotations "git_sha=$GITHUB_SHA" "$image"
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --annotations "git_sha=$GITHUB_SHA" "$image" > /dev/null
          done
          echo "Both image digests signed and identity-verified." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: published-image-audits
          path: published-*-audit.json
          retention-days: 30
