name: Verify console
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env: {POSTGRES_USER: obs, POSTGRES_PASSWORD: obs_local, POSTGRES_DB: obs}
        ports: [55432:5432]
        options: --health-cmd "pg_isready -U obs -d obs" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MODE: demo
      DATABASE_URL: postgresql://obs:obs_local@127.0.0.1:55432/obs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements.lock}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.lock && .venv/bin/pip install --no-deps -e backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: .venv/bin/python -m obs.migrate && .venv/bin/python -m obs.demo.seed
      - run: make lint && make test && make build
      - run: make types && git diff --exit-code -- backend/openapi.json frontend/src/api/generated.ts
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Browser walkthrough
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m uvicorn obs.api.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          api_pid=$!
          .venv/bin/python -m obs.collector > /tmp/collector.log 2>&1 &
          collector_pid=$!
          .venv/bin/python -m obs.alerter > /tmp/alerter.log 2>&1 &
          alerter_pid=$!
          (cd frontend && npm run dev) > /tmp/web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$collector_pid" "$alerter_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/health > /dev/null; then break; fi
            sleep 1
          done
          make e2e
          node scripts/browser-compat.mjs
          .venv/bin/python scripts/load_test.py --requests 20 --concurrency 2 --rate 4 --max-p95-ms 3000 > output/load-smoke.json
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with: {version: v3.18.6}
      - run: helm lint deploy/helm/obs-console && helm template obs deploy/helm/obs-console --set backup.enabled=true --set ingress.enabled=true > /tmp/rendered.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: console-verification
          path: |
            output/screenshots
            frontend/playwright-report
            frontend/test-results
            output/load-smoke.json

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MODE: demo
      OBS_WEB_PORT: 18080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and run demo containers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          cp .env.example .env
          finish() {
            status=$?
            docker compose logs --no-color > /tmp/container.log || true
            docker compose logs --no-color web > /tmp/web-container.log || true
            if [ "$status" -ne 0 ]; then
              python3 scripts/ci_diagnostics.py /tmp/web-container.log /tmp/container-build.log /tmp/container.log
            fi
            docker compose down -v || true
            exit "$status"
          }
          trap finish EXIT
          make demo 2>&1 | tee /tmp/container-build.log
          node scripts/container-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: container-diagnostics
          path: |
            /tmp/container-build.log
            /tmp/container.log
            /tmp/web-container.log
