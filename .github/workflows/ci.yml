name: Verify console
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.9-bookworm
        env: {POSTGRES_USER: obs, POSTGRES_PASSWORD: obs_local, POSTGRES_DB: obs}
        ports: [55432:5432]
        options: --health-cmd "pg_isready -U obs -d obs" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MODE: demo
      DATABASE_URL: postgresql://obs:obs_local@127.0.0.1:55432/obs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements.lock}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.lock && .venv/bin/pip install --no-deps -e backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: .venv/bin/python -m obs.migrate && .venv/bin/python -m obs.demo.seed
      - run: make lint && make test && make build
      - run: make types && git diff --exit-code -- backend/openapi.json frontend/src/api/generated.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser walkthrough
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m uvicorn obs.api.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          api_pid=$!
          .venv/bin/python -m obs.collector > /tmp/collector.log 2>&1 &
          collector_pid=$!
          .venv/bin/python -m obs.alerter > /tmp/alerter.log 2>&1 &
          alerter_pid=$!
          (cd frontend && npm run dev) > /tmp/web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$collector_pid" "$alerter_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/health > /dev/null; then break; fi
            sleep 1
          done
          make e2e
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.18.6}
      - run: helm lint deploy/helm/obs-console && helm template obs deploy/helm/obs-console --set backup.enabled=true --set ingress.enabled=true > /tmp/rendered.yaml
      - name: Build production containers
        run: docker compose build api web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-verification
          path: |
            output/screenshots
            frontend/playwright-report
            frontend/test-results
