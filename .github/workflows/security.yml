name: Release safeguards
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safeguards-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit the complete Python lock
        run: pip-audit --requirement backend/requirements.lock --no-deps --disable-pip --format json --output python-audit.json
      - name: Install locked frontend dependencies
        if: always()
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Audit production and development frontend dependencies
        if: always()
        run: npm audit --audit-level=high --json > ../npm-audit.json
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audits
          path: '*-audit.json'
          retention-days: 30

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: api, dockerfile: backend/Dockerfile, context: .}
          - {component: web, dockerfile: frontend/Dockerfile, context: frontend}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Build the actual release image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          COMPONENT: ${{ matrix.component }}
        run: docker build --pull --file "$DOCKERFILE" --tag "obs-$COMPONENT:scan" "$BUILD_CONTEXT"
      - name: Record all known image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: obs-${{ matrix.component }}:scan
          grype-version: v0.121.2
          fail-build: false
          output-format: json
          output-file: image-${{ matrix.component }}-all.json
      - name: Block fixable high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: obs-${{ matrix.component }}:scan
          grype-version: v0.121.2
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: image-${{ matrix.component }}-gate.json
      - name: Surface fixable vulnerability diagnostics
        if: failure()
        env:
          COMPONENT: ${{ matrix.component }}
        run: python3 scripts/image_diagnostics.py "image-$COMPONENT-gate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-audit-${{ matrix.component }}
          path: image-*.json
          retention-days: 30

  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env: {POSTGRES_USER: obs, POSTGRES_PASSWORD: drill_local, POSTGRES_DB: postgres}
        ports: [55432:5432]
        options: --health-cmd "pg_isready -U obs -d postgres" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MODE: demo
      OBS_DRILL_ADMIN_DSN: postgresql://obs:drill_local@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: python -m pip install -r backend/requirements.lock && python -m pip install --no-deps -e backend
      - name: Check PostgreSQL 16 clients
        run: |
          test -x /usr/lib/postgresql/16/bin/pg_dump
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Dump, restore, compare all tables and exercise nonempty-target guard
        run: python scripts/recovery_drill.py --confirm-isolated > recovery-drill.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: recovery-drill
          path: recovery-drill.json
          retention-days: 30
