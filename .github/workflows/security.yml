name: Release safeguards
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safeguards-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar --extract --gzip --file="$archive" --directory="$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan complete Git history
        run: gitleaks detect --source . --redact --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit the complete Python lock
        run: pip-audit --requirement backend/requirements.lock --no-deps --disable-pip --format json --output python-audit.json
      - name: Install locked frontend dependencies
        if: always()
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Audit production and development frontend dependencies
        if: always()
        run: npm audit --audit-level=high --json > ../npm-audit.json
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audits
          path: '*-audit.json'
          retention-days: 30

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: api, dockerfile: backend/Dockerfile, context: .}
          - {component: web, dockerfile: frontend/Dockerfile, context: frontend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Build the actual release image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          COMPONENT: ${{ matrix.component }}
        run: docker build --pull --file "$DOCKERFILE" --tag "obs-$COMPONENT:scan" "$BUILD_CONTEXT"
      - name: Record all known image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: obs-${{ matrix.component }}:scan
          grype-version: v0.121.2
          fail-build: false
          output-format: json
          output-file: image-${{ matrix.component }}-all.json
      - name: Block fixable high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: obs-${{ matrix.component }}:scan
          grype-version: v0.121.2
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: image-${{ matrix.component }}-gate.json
      - name: Surface fixable vulnerability diagnostics
        if: failure()
        env:
          COMPONENT: ${{ matrix.component }}
        run: python3 scripts/image_diagnostics.py "image-$COMPONENT-gate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-audit-${{ matrix.component }}
          path: image-*.json
          retention-days: 30

  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env: {POSTGRES_USER: obs, POSTGRES_PASSWORD: drill_local, POSTGRES_DB: postgres}
        ports: [55432:5432]
        options: --health-cmd "pg_isready -U obs -d postgres" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MODE: demo
      OBS_DRILL_ADMIN_DSN: postgresql://obs:drill_local@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: python -m pip install -r backend/requirements.lock && python -m pip install --no-deps -e backend
      - name: Check PostgreSQL 16 clients
        run: |
          test -x /usr/lib/postgresql/16/bin/pg_dump
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Dump, restore, compare all tables and exercise nonempty-target guard
        run: python scripts/recovery_drill.py --confirm-isolated > recovery-drill.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: recovery-drill
          path: recovery-drill.json
          retention-days: 30
